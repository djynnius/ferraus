# cargo-deny: license and source policy. Core crates stay permissive; the GPL VST3 host is a
# separate binary crate and is allowed its own license.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD",
  "CDLA-Permissive-2.0", "MIT-0", "OpenSSL", "Unlicense",
]
confidence-threshold = 0.9
exceptions = [
  { allow = ["GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later"], crate = "ferraus-plughost-vst3" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
