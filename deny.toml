# cargo-deny: license and source policy. Everything stays permissive except the LGPL engraving
# helper, which is a separate executable.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD",
  "CDLA-Permissive-2.0", "MIT-0", "OpenSSL", "Unlicense",
]
confidence-threshold = 0.9
exceptions = [
  # Verovio (engraving) is LGPL and isolated in the separate ferraus-engrave executable
  { allow = ["LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later"], crate = "ferraus-engrave" },
  { allow = ["LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later", "OFL-1.1"], crate = "verovio" },
  { allow = ["LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later", "OFL-1.1"], crate = "verovio-sys" },
  { allow = ["LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later", "OFL-1.1"], crate = "verovio-data" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
