name: ORT probe
on:
  push:
    branches: [ort-from-source]
    paths: [.github/workflows/ort-probe.yml]
permissions:
  contents: read
jobs:
  alpine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: alpine/git:2.54.0
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cat /etc/alpine-release; uname -m; apk add --no-cache gcc g++ cmake && gcc --version
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.runner }}
          path: README.md
  intel:
    runs-on: macos-15-intel
    steps:
      - run: uname -m; sw_vers; sysctl -n hw.ncpu; clang --version; cmake --version || true
  winarm:
    runs-on: windows-11-arm
    steps:
      - run: |
          where.exe candle.exe
          $env:WIX
          dir "C:\Program Files (x86)" | findstr /i wix
        continue-on-error: true
