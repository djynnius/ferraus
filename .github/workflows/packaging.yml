# Dry runs of the package-manager scripts against the latest release, so a broken script shows
# up before a release (publishing happens in publish-packages.yml).
name: Packaging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packaging/scoop/**"
      - "packaging/linux-repos/**"
      - ".github/workflows/packaging.yml"
  pull_request:
    paths:
      - "packaging/scoop/**"
      - "packaging/linux-repos/**"
      - ".github/workflows/packaging.yml"

permissions:
  contents: read

jobs:
  scoop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Manifest for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          pwsh ./packaging/scoop/update-bucket.ps1 -Version "$tag" -DryRun | tee ferraus.json
          jq -e --arg v "${tag#v}" '.version == $v and (.architecture["64bit"].hash | test("^[0-9a-f]{64}$"))' ferraus.json

  linux-repos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools and a throwaway signing key
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q dpkg-dev apt-utils createrepo-c
          gpg --batch --passphrase '' --quick-gen-key "ferraus test" rsa3072 sign never
      - name: Packages from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" -p '*.deb' -p '*.rpm' -D pkgs
      - name: Build the repositories (twice, as consecutive releases do)
        run: |
          mkdir repo
          ./packaging/linux-repos/update.sh repo pkgs file:///repo
          ./packaging/linux-repos/update.sh repo pkgs file:///repo
          find repo -maxdepth 2 | sort
      - name: Install with apt (Debian 13)
        run: |
          docker run --rm -v "$PWD/repo:/repo:ro" debian:trixie sh -euxc '
            mkdir -p /etc/apt/keyrings
            cp /repo/ferraus-archive-keyring.asc /etc/apt/keyrings/
            cp /repo/apt/ferraus.sources /etc/apt/sources.list.d/
            apt-get update
            apt-get install -y ferraus
            ferraus --version
            test -x /usr/lib/ferraus/ferraus-plughost'
      - name: Install with dnf (Fedora)
        run: |
          docker run --rm -v "$PWD/repo:/repo:ro" fedora:latest sh -euxc '
            cp /repo/rpm/ferraus.repo /etc/yum.repos.d/
            dnf install -y ferraus
            ferraus --version'
