# Layer 2: model parity, benchmarks, and offline full-suite runs.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/ferraus/models
          key: models-${{ hashFiles('crates/ferraus-models/registry/registry.json') }}
      - name: Pull models for tests
        run: |
          cargo run -q --release -p ferraus -- models pull --all-for separate -y || true
          cargo run -q --release -p ferraus -- models pull omr/oemer omr/oemer-seg -y || true
      # Fetch every dependency (dev-dependencies included), build the tests and the binaries the
      # ignored tests call while the network is still up; the next step only runs them.
      - name: Build tests
        run: |
          cargo test --workspace --release --locked --no-run
          cargo build --workspace --release --locked --bins
      # A fresh network namespace has only a loopback interface, and it starts down; the
      # download tests serve files from 127.0.0.1. Anything else on the network is unreachable.
      - name: Full suite with network disabled
        run: |
          sudo unshare -n -- sh -c 'ip link set lo up && exec sudo -u "$0" env PATH="$1" HOME="$2" \
            cargo test --workspace --release --offline --no-fail-fast -- --include-ignored' \
            "$USER" "$PATH" "$HOME"

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Real-time factors (fails on >15% regression vs baseline)
        run: cargo test --workspace --release -- --ignored bench

  model-parity:
    # Needs the PyTorch reference environment and licensed evaluation data.
    runs-on: [self-hosted, gpu]
    # opt in with the repository variable GPU_RUNNER=true once a self-hosted GPU runner exists
    if: github.repository == 'djynnius/ferraus' && vars.GPU_RUNNER == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: ONNX vs PyTorch parity (max abs error < 1e-4)
        run: python3 tools/export/parity.py --all
      - name: Separation benchmark (MUSDB18-HQ)
        run: python3 tools/eval/separation.py --musdb "$MUSDB_ROOT" --tiers fast,balanced,quality,max
