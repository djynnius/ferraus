# dist publish job: apt and dnf repositories, container images, winget and scoop manifests,
# and crates.io. Runs only from the release workflow, behind the `release` environment,
# whose required reviewers are the human approval gate. Signing keys live only in that
# environment's secrets.
name: Publish packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-attestations:
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true
      - name: Refuse artifacts without a workflow attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*.tar.xz dist/*.zip dist/*.msi dist/*.deb dist/*.rpm; do
            [ -e "$f" ] || continue
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

  apt-dnf:
    needs: verify-attestations
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-linux-packages-*
          path: pkgs
          merge-multiple: true
      - name: Import signing key
        run: echo "${{ secrets.PACKAGE_SIGNING_KEY }}" | gpg --batch --import
      - name: Update apt repository
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p pages/apt/pool
          cp pkgs/*.deb pages/apt/pool/
          cd pages/apt
          dpkg-scanpackages --multiversion pool > Packages && gzip -kf Packages
          apt-ftparchive release . > Release
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes -abs -o Release.gpg Release
      - name: Update dnf repository
        run: |
          sudo apt-get install -y createrepo-c
          mkdir -p pages/rpm
          cp pkgs/*.rpm pages/rpm/
          createrepo_c pages/rpm
          gpg --batch --yes --detach-sign --armor pages/rpm/repodata/repomd.xml
      - name: Push
        run: |
          cd pages
          git config user.name "ferraus release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A && git commit -m "Publish packages for ${{ github.ref_name }}" && git push

  containers:
    needs: verify-attestations
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: ghcr.io/djynnius/ferraus:${{ github.ref_name }},ghcr.io/djynnius/ferraus:latest
      - name: CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ghcr.io/djynnius/ferraus:${{ github.ref_name }}-cuda

  winget-scoop:
    needs: verify-attestations
    runs-on: windows-2022
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: winget PR
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: djynnius.ferraus
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: ./packaging/scoop/update-bucket.ps1 -Version "${{ github.ref_name }}"

  crates-io:
    needs: verify-attestations
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./packaging/publish-crates.sh
