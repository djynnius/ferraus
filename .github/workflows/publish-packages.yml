# dist publish job: crates.io, plus opt-in apt and dnf repositories, container images, and
# winget and scoop manifests (repository variables PUBLISH_APT_DNF, PUBLISH_CONTAINERS,
# PUBLISH_WINGET, PUBLISH_SCOOP). Runs only from the release workflow, behind the `release` environment,
# whose required reviewers are the human approval gate. Signing keys live only in that
# environment's secrets.
name: Publish packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-attestations:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true
      - name: Refuse artifacts without a workflow attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*.tar.xz dist/*.zip dist/*.msi dist/*.deb dist/*.rpm; do
            [ -e "$f" ] || continue
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

  apt-dnf:
    needs: verify-attestations
    # The repositories live in djynnius/packages (served by its GitHub Pages at
    # https://djynnius.github.io/packages/), because this repository's Pages site is the docs.
    # Opt in with the repository variable PUBLISH_APT_DNF=true once that repository,
    # PACKAGES_REPO_TOKEN, and PACKAGE_SIGNING_KEY exist (docs/dev/RELEASE-SETUP.md section 6).
    if: vars.PUBLISH_APT_DNF == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: djynnius/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: pages
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-linux-packages-*
          path: pkgs
          merge-multiple: true
      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: echo "$PACKAGE_SIGNING_KEY" | gpg --batch --import
      - name: Update the apt and dnf repositories
        run: |
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c
          ./src/packaging/linux-repos/update.sh pages pkgs https://djynnius.github.io/packages
      - name: Push
        run: |
          cd pages
          git config user.name "ferraus release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A && git commit -m "Publish packages for ${{ github.ref_name }}" && git push

  containers:
    needs: verify-attestations
    # opt in with the repository variable PUBLISH_CONTAINERS=true
    if: vars.PUBLISH_CONTAINERS == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      # the CPU image packages the attested Linux release archives (no compiling under emulation)
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true
      - name: Free disk space (the CUDA base image and a Rust build need most of the runner's disk)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: ghcr.io/djynnius/ferraus:${{ github.ref_name }},ghcr.io/djynnius/ferraus:latest
      - name: CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ghcr.io/djynnius/ferraus:${{ github.ref_name }}-cuda

  winget:
    needs: verify-attestations
    # opt in with the repository variable PUBLISH_WINGET=true once WINGET_TOKEN exists
    if: vars.PUBLISH_WINGET == 'true'
    runs-on: windows-2022
    environment: release
    steps:
      - name: winget pull request
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: djynnius.ferraus
          # only the ferraus MSIs (the release also carries ferraus-engrave and plugin-host MSIs)
          installers-regex: '^ferraus-(x86_64|aarch64)-pc-windows-msvc\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}

  scoop:
    needs: verify-attestations
    # opt in with the repository variable PUBLISH_SCOOP=true once djynnius/scoop-bucket and
    # SCOOP_BUCKET_TOKEN exist
    if: vars.PUBLISH_SCOOP == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: ./packaging/scoop/update-bucket.ps1 -Version "${{ github.ref_name }}"

  crates-io:
    needs: verify-attestations
    runs-on: ubuntu-24.04
    # the first release waits out crates.io's new-crate rate limit (about 10 minutes per crate)
    timeout-minutes: 360
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./packaging/publish-crates.sh
