[package]
name = "ferraus-codec"
description = "Decoding and encoding for ferraus: Symphonia decoders, native WAV/AIFF/FLAC/Vorbis/Opus/MP3 encoders, tags, and the FFmpeg bridge locator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["mp3-lame", "opus-dyn", "vorbis"]
# MP3 encoding through a system libmp3lame (LGPL) loaded at run time; never linked.
mp3-lame = []
# Opus encode/decode through a system libopus loaded at run time (no build-time C deps).
opus-dyn = []
# Ogg Vorbis encoding via vorbis_rs (bundled BSD libvorbis built with cc).
vorbis = ["dep:vorbis_rs"]

[dependencies]
ferraus-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rustfft.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = ["all", "opt-simd"] }
flacenc = "0.5"
lofty = "0.25"
ebur128 = "0.1.10"
libloading = "0.9"
ogg = "0.9"
vorbis_rs = { version = "0.5", optional = true }
