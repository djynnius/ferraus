[package]
name = "ferraus-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferraus-codec = { path = ".." }
ferraus-core = { path = "../../ferraus-core" }

# Not part of the main workspace; run with `cargo +nightly fuzz run decode` from this crate.
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
