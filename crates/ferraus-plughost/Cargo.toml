[package]
name = "ferraus-plughost"
description = "Out-of-process CLAP plugin host used by ferraus (one plugin per process)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.dist]
# Shipped inside the ferraus archive by the release workflow, not as a separate app.
dist = false

[dependencies]
# Only the wire protocol and host runtime: no network, archive, or registry code.
ferraus-plugins = { path = "../ferraus-plugins", version = "0.1.1", default-features = false }
clap-sys = "0.5"
libloading = "0.8"
