[package]
name = "ferraus-test-plugin"
description = "Tiny CLAP test plugins (gain, fixed-latency delay, sine instrument, crash, hang) and a VST3 gain for ferraus' plugin-host tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
dist = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.5"
# MIT/Apache-2.0 bindings; used only for the VST3 test gain class (src/vst3_gain.rs)
vst3 = "0.3"
