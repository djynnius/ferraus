[package]
name = "ferraus-plughost-vst3"
description = "Out-of-process VST3 plugin host used by ferraus (speaks the same protocol as ferraus-plughost)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
# Released as its own app (archive + installers) so a crashing plugin cannot take ferraus down;
# ferraus finds it next to itself or on PATH.
dist = true

[package.metadata.wix]
upgrade-guid = "40EECA67-8F1E-49C3-B1A3-D7BD3B0DEFB3"
path-guid = "7C394D4A-587C-442F-911B-2BE14354D72A"
license = false
eula = false

[dependencies]
ferraus-plugins = { path = "../ferraus-plugins", version = "0.1.1", default-features = false }
vst3 = "0.3"
libloading = "0.8"
