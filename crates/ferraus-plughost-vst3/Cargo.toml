[package]
name = "ferraus-plughost-vst3"
description = "Out-of-process VST3 plugin host used by ferraus (GPLv3; speaks the same protocol as ferraus-plughost)"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
# Released as its own GPLv3 app (archive + installers); ferraus finds it next to
# itself or on PATH.
dist = true
# Not on the static musl targets: a statically linked program cannot load plugin libraries.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]

[package.metadata.wix]
upgrade-guid = "40EECA67-8F1E-49C3-B1A3-D7BD3B0DEFB3"
path-guid = "7C394D4A-587C-442F-911B-2BE14354D72A"
license = false
eula = false

[dependencies]
ferraus-plugins = { path = "../ferraus-plugins", version = "0.1.1", default-features = false }
vst3 = "0.3"
libloading = "0.8"
