[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to
tap = "djynnius/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = ["$FERRAUS_INSTALL_DIR/", "~/.ferraus/bin"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-packages"]
# Extra artifacts built once per release (deb/rpm, container images, signed model registry)
global-artifacts-jobs = ["./build-linux-packages", "./sign-registries"]
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# Extra static files to include in each app archive
include = ["crates/ferraus-cli/THIRD-PARTY-LICENSES.md"]
# ONNX Runtime's prebuilt Windows libraries use the DLL C runtime (/MD); a static CRT does not
# link (LNK2019 on __imp_ symbols). Windows users need the Visual C++ Redistributable.
msvc-crt-static = false
# release.yml carries hand edits (the Homebrew job runs in the release environment); keep them
# when regenerating with `dist generate`
allow-dirty = ["ci"]
# Sign and notarize macOS binaries in CI: off until a Developer ID certificate is set up
# (CODESIGN_* secrets, docs/dev/RELEASE-SETUP.md section 4); then set this to true and run `dist generate`
macos-sign = false

# ONNX Runtime's prebuilt Linux libraries (ort) need glibc 2.38+, so Linux builds run on
# Ubuntu 24.04 and the release supports Ubuntu 24.04+, Debian 13+, Fedora 39+. There is no
# musl build: ort ships no musl library, and no Intel macOS library (Apple silicon only).
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
