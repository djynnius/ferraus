[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to
tap = "djynnius/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = ["$FERRAUS_INSTALL_DIR/", "~/.ferraus/bin"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-packages"]
# Extra artifacts built once per release (deb/rpm, container images, signed model registry)
global-artifacts-jobs = ["./build-linux-packages", "./sign-registries"]
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# Extra static files to include in each app archive
include = ["crates/ferraus-cli/THIRD-PARTY-LICENSES.md"]
# Sign and notarize macOS binaries in CI (needs the CODESIGN_* secrets, see docs/dev/RELEASING.md)
macos-sign = true
