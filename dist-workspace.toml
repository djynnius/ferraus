[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Build only the packages that ship, one at a time: the test-plugin fixture is a cdylib, which
# the static musl targets cannot produce
precise-builds = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to
tap = "djynnius/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = ["$FERRAUS_INSTALL_DIR/", "~/.ferraus/bin"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-packages"]
# Extra artifacts built once per release (deb/rpm, container images, signed model registry)
global-artifacts-jobs = ["./build-linux-packages", "./sign-registries"]
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# Extra static files to include in each app archive
include = ["crates/ferraus-cli/THIRD-PARTY-LICENSES.md"]
# ONNX Runtime's prebuilt Windows libraries use the DLL C runtime (/MD); a static CRT does not
# link (LNK2019 on __imp_ symbols). Windows users need the Visual C++ Redistributable.
msvc-crt-static = false
# release.yml carries hand edits (the Homebrew job runs in the release environment); keep them
# when regenerating with `dist generate`
allow-dirty = ["ci"]
# Sign and notarize macOS binaries in CI: off until a Developer ID certificate is set up
# (CODESIGN_* secrets, docs/dev/RELEASE-SETUP.md section 4); then set this to true and run `dist generate`
macos-sign = false

# Steps run before `dist build` in each build-local-artifacts job (path relative to
# .github/workflows): they build ONNX Runtime from source for the targets ort ships no prebuilt
# library for (x86_64-apple-darwin, *-unknown-linux-musl; cached, see .github/actions/onnxruntime)
# and install WiX 3.14 for the aarch64-pc-windows-msvc MSI (the windows-11-arm image has no WiX)
github-build-setup = "../build-setup.yml"

# ONNX Runtime's prebuilt Linux libraries (ort) need glibc 2.38+, so the glibc builds run on
# Ubuntu 24.04 and support Ubuntu 24.04+, Debian 13+, Fedora 39+. The musl builds are fully
# static (ONNX Runtime built from source with Alpine's GCC and musl): they run on Alpine and on
# older glibc distributions. Intel macOS links an ONNX Runtime built from source on the Intel
# runner; Windows ARM64 uses ort's prebuilt library.
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-apple-darwin = "macos-15-intel"
aarch64-pc-windows-msvc = "windows-11-arm"
